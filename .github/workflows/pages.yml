name: Publish Summer Racer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static website
        run: |
          mkdir -p dist
          cp index.html racing.css dist/
          cp -R assets src dist/
          touch dist/.nojekyll

      - name: Upload game website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
